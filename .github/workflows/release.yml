name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Version Match
        run: |
          # Extract version from tag (remove leading 'v')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          # Extract version from .el file (looking for ;; Version: X.Y)
          FILE_VERSION=$(grep -oP ';; Version: \s*\K[0-9.]+' python-unicode-escape.el)
          
          echo "Tag version: $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match File version ($FILE_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            python-unicode-escape.el
